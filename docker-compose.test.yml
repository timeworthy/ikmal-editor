services:
  quality:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--quality-server"]
    environment:
      IKMAL_BIND_HOST: 0.0.0.0
      IKMAL_QUALITY_PORT: "8098"
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8098/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--quality-proxy"]
    environment:
      IKMAL_BIND_HOST: 0.0.0.0
      IKMAL_QUALITY_PROXY_PORT: "8096"
      IKMAL_LANGUAGETOOL_URL: http://127.0.0.1:8097/v2/check
      IKMAL_QUALITY_URL: http://quality:8098/v1/analyze
    depends_on:
      quality:
        condition: service_healthy
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 2s
      timeout: 2s
      retries: 20

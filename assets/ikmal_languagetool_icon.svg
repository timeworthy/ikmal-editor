<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Midnight Background Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#181d2a"/>
    </linearGradient>

    <!-- LanguageTool Signature Red-Yellow Wavy Squiggly Gradient -->
    <linearGradient id="lt-squiggly-icon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ffa600"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#icon-bg)"/>

  <!-- Center Door Icon with Ikmal Editor monogram -->
  <g transform="translate(256, 256)" filter="url(#icon-shadow)">
    <!-- Arched Door Silhouette (Indigo #5f6ad3) -->
    <path d="M-130 160 L-130 -40 A130 130 0 0 1 130 -40 L130 160 Z" fill="#5f6ad3"/>

    <!-- Burnt Orange Door Knob (Positioned low on right edge with generous distance) -->
    <circle cx="95" cy="95" r="14" fill="#c47b4a"/>

    <!-- Ikmal Editor monogram inside door -->
    <text x="0" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.03em">
      IE
    </text>

    <!-- Writing-quality squiggle beneath the Ikmal Editor monogram -->
    <path d="M-85 34 Q-68 47 -51 34 T-17 34 T17 34 T51 34 T85 34" fill="none" stroke="url(#lt-squiggly-icon)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>

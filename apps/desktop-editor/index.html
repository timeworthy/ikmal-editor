<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ikmal editor — rewrite slice</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="primitives.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="desktop-slice" aria-label="ikmal editor rewrite slice">
    <header class="slice-header">
      <div><p class="slice-kicker">IKMAL EDITOR</p><h1 id="slice-title">Writing workspace</h1></div>
      <!-- Settings is a mode, and a mode needs a way out that says so. It was
           left by pressing the same button that opened it, which reads as a
           toggle only to whoever wrote it. -->
      <!-- The route between the two windows ran one way: the launcher could open
           this window, and this window could not open the launcher. -->
      <div class="slice-actions"><span id="service-status" class="slice-service">Local checker</span><button id="open-launcher" class="cnt-btn" type="button" title="Quick check (the menubar window)">Quick check</button><button id="check" class="cnt-btn" type="button">Check</button><button id="open-settings" class="cnt-btn" type="button">Settings</button><button id="close-settings" class="cnt-btn" type="button" hidden>Done</button></div>
    </header>
    <!-- Two ways to see findings, both real choices. The sidebar is the
         default because working through a document is what this window is for;
         the panel is for a narrow window, or for wanting the text by itself.
         The layout is one attribute so the difference is CSS rather than two
         renderers. -->
    <div class="slice-workspace" id="workspace" data-layout="sidebar">
    <section class="slice-editor cnt-card">
      <label for="editor-input">Draft</label>
      <!-- The field and the mark overlay are one surface: the overlay is a
           second copy of the draft with transparent text, so it must sit in the
           same box with the same metrics or the underlines drift off the words.
           It is hidden from assistive tech because it would otherwise be the
           draft read a second time. The card is anchored inside the surface so
           it can point at the mark it describes. -->
      <div class="writing-marks-surface" id="editor-surface">
        <textarea id="editor-input" class="writing-marks-input" spellcheck="true" placeholder="Write or paste a passage here. This scratch pad is not saved."></textarea>
        <div class="writing-marks" id="editor-marks" aria-hidden="true"></div>
        <!-- In the corner of the field it describes, which is where a writer
             looks for it. It sat under the card as a loose pill, far enough
             from the text to read as a caption for the page rather than a
             status for the draft. -->
        <div id="indicator-anchor" class="slice-indicator" aria-live="polite"></div>
        <div id="issue-popover" class="slice-popover" hidden></div>
      </div>
      <!-- Said where a writer who has already started typing can still see it:
           the placeholder is gone the moment there is a draft to lose. -->
      <div class="slice-footer"><span id="counts">0 words · 0 characters</span><span class="slice-unsaved">Not saved</span><span id="revision">Revision 0</span></div>
    </section>
    <aside class="slice-review cnt-card" id="review-sidebar" aria-label="Findings"></aside>
    </div>
    <!-- The product's only settings implementation. The launcher routes here
         rather than carrying a copy of it. -->
    <section id="settings-view" hidden aria-label="Settings"></section>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>

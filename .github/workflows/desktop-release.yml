name: Build desktop release bundles

# The push triggers are how this gets rehearsed. `release` and
# `workflow_dispatch` are only registered from the default branch, so while
# these workflows live on a feature branch neither can fire — which is how the
# pipeline reached its first real use never having run once. A push event
# resolves the workflow from the ref being pushed, so it works from anywhere.
#
# A staging run builds and archives exactly as a release does, then keeps the
# bundles as workflow artifacts instead of publishing them. Nothing public is
# created, so a rehearsal costs nothing but runner time.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the desktop bundles
        required: true
        type: string
  push:
    # A branch for iterating on the workflow itself, and a release-candidate tag
    # for rehearsing against a frozen tree.
    branches: [staging]
    tags: ['v*-rc*']

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  # A superseded rehearsal is worth cancelling; a release in flight is not.
  # Without this a staging run that hangs holds the group and every later push
  # queues behind it.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  package:
    name: ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
          # Cross-packaged from Apple silicon. This was macos-13, which GitHub
          # has retired: the job sat queued with no runner while every other
          # one finished, and would have done that for six hours during a
          # release. Nothing here needs x64 hardware — the Go build is
          # CGO_ENABLED=0 with an explicit GOARCH, and Electron ships a
          # prebuilt binary per architecture.
          - runner: macos-14
            platform: darwin
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      # A staging run has no release behind it, so the pushed ref names the
      # archives: a tag gives v0.9.1-rc1, the branch gives staging.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
      IKMAL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      IKMAL_DESKTOP_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # The verify and package steps below build the portable writing packages,
      # which means they shell out to tsc. A runner has no global one, so the
      # workspace install is what makes those steps work at all.
      - name: Install workspace dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify desktop package
        working-directory: desktop
        run: npm run verify

      - name: Build desktop bundle
        working-directory: desktop
        run: npm run package

      - name: Archive Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Discovered rather than spelled out. The packager names the bundle
          # from desktop/package_desktop.mjs, and this step used to repeat that
          # name in a different case: "Ikmal Editor-…" against the "ikmal
          # editor-…" actually produced. macOS and Windows are case-insensitive
          # and never noticed; Linux would have failed here at release time.
          bundle=$(ls "bin/desktop" | grep -- "-${IKMAL_DESKTOP_PLATFORM}-${IKMAL_DESKTOP_ARCH}$" | head -1)
          if [ -z "$bundle" ]; then
            echo "No bundle for ${IKMAL_DESKTOP_PLATFORM}-${IKMAL_DESKTOP_ARCH}. bin/desktop holds:" >&2
            ls "bin/desktop" >&2
            exit 1
          fi
          archive="ikmal-editor-${RELEASE_TAG}-desktop-${IKMAL_DESKTOP_PLATFORM}-${IKMAL_DESKTOP_ARCH}.tar.gz"
          tar -czf "$archive" -C "bin/desktop" "$bundle"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Discovered, for the same reason as the Unix step above.
          $bundle = (Get-ChildItem "bin/desktop" -Directory |
            Where-Object { $_.Name -like "*-$env:IKMAL_DESKTOP_PLATFORM-$env:IKMAL_DESKTOP_ARCH" } |
            Select-Object -First 1).Name
          if (-not $bundle) { throw "No bundle for $env:IKMAL_DESKTOP_PLATFORM-$env:IKMAL_DESKTOP_ARCH in bin/desktop" }
          $archive = "ikmal-editor-$env:RELEASE_TAG-desktop-$env:IKMAL_DESKTOP_PLATFORM-$env:IKMAL_DESKTOP_ARCH.zip"
          Compress-Archive -Path "bin/desktop/$bundle" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $archive" | Set-Content "$archive.sha256"
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      # A rehearsal keeps its bundles here, where they can be downloaded and
      # inspected, and publishes nothing.
      - name: Keep the staging bundle as an artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop bundle to release
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber

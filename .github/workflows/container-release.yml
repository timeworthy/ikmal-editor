name: Publish container image

# Publishes ghcr.io/timeworthy/ikmal-editor, which the Unraid template pulls.
# Kept separate from release.yml because that workflow only syncs version.json
# and needs no registry credentials.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve version and latest-tag policy
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # `latest` must never follow a prerelease. The current line is
          # 0.9.0-beta, so a plain `docker pull` should not land on it.
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (prerelease=$prerelease)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 covers Raspberry Pi 3/4/5 in 64-bit mode, which the README
          # advertises. The runtime base (eclipse-temurin:17-jre-jammy) has no
          # armv7 variant, so 32-bit Pi installs use the tarball instead.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prerelease == 'false' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.title=ikmal editor
            org.opencontainers.image.description=Local writing enhancer and LanguageTool supervisor
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the published image runs
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Pull back the pushed amd64 manifest and check the entrypoint works,
          # so a broken image fails the release rather than a user's Unraid box.
          docker run --rm --platform linux/amd64 "$IMAGE" -version

name: Publish release version.json

# Keeps version.json at the repo root in sync with the most recent published
# release. The CLI reads the public file from this repository during its daily
# update check, so no separate site deployment is required.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-version-json
  cancel-in-progress: false

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve latest published release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ignore drafts and prereleases-superseded-by-newer by asking the API
          # for what it considers current, rather than trusting the trigger payload
          # (a re-published older release would otherwise roll the file backwards).
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                 --json tagName,isDraft,isPrerelease,createdAt)
          # The stable pointer must never name a prerelease. This selected the
          # newest non-draft release of any kind, so publishing a beta wrote it
          # into version.json and every user on the daily check was told to
          # install it — the opposite of what a prerelease means.
          tag=$(printf '%s' "$releases" | jq -r 'map(select((.isDraft|not) and (.isPrerelease|not))) | sort_by(.createdAt) | last | .tagName // ""')
          # The newest prerelease is published alongside it, so a tester who has
          # opted in can be told, and nobody else is.
          pre=$(printf '%s' "$releases" | jq -r 'map(select((.isDraft|not) and .isPrerelease)) | sort_by(.createdAt) | last | .tagName // ""')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            # A project with only prereleases has no stable version to advertise.
            # Leaving the existing value alone is right: inventing one would tell
            # stable users to install something that was never released to them.
            echo "No published stable release; leaving the stable version untouched."
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Strip the leading v so the file matches appVersion in main.go.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${pre#v}" >> "$GITHUB_OUTPUT"
          # What to name in the commit message. With no stable release the tag
          # is empty, which produced "publish version.json for " with nothing
          # after it.
          echo "label=${tag:-$pre}" >> "$GITHUB_OUTPUT"
          echo "Stable: ${tag:-none}   Prerelease: ${pre:-none}"

      - name: Write version.json
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          # An empty stable version leaves the existing one in place; a project
          # with only prereleases has nothing to advertise on the stable channel
          # and must not be given one.
          jq --arg v "$VERSION" --arg p "$PRERELEASE" '
            (if $v == "" then . else .version = $v end)
            | if $p == "" then del(.prerelease) else .prerelease = $p end
          ' version.json > "$tmp"
          mv "$tmp" version.json
          echo "--- version.json ---"
          cat version.json

      - name: Verify it still parses the way the CLI parses it
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The CLI uses a hand-rolled string scan, not encoding/json, so assert
          # the keys are extractable and that "url" is not shadowed by a URL
          # appearing earlier in the document.
          jq -e '.version and .url' version.json > /dev/null
          if [ -n "$VERSION" ]; then
            got=$(jq -r '.version' version.json)
            [ "$got" = "$VERSION" ] || { echo "version mismatch: $got != $VERSION"; exit 1; }
          fi
          if [ -n "$PRERELEASE" ]; then
            got=$(jq -r '.prerelease' version.json)
            [ "$got" = "$PRERELEASE" ] || { echo "prerelease mismatch: $got != $PRERELEASE"; exit 1; }
          fi
          # The stable pointer must never name a prerelease, whatever the inputs
          # were. This is the assertion that protects users who did not opt in.
          stable=$(jq -r '.version' version.json)
          case "$stable" in
            *-*) echo "version.json names a prerelease as stable: $stable"; exit 1 ;;
          esac
          head -c 200 version.json | grep -q '"version"' || { echo '"version" not in first 200 bytes'; exit 1; }

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- version.json; then
            echo "version.json already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: publish version.json for ${{ steps.rel.outputs.label }}"
          git push origin HEAD:main

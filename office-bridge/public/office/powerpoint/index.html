<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ikmal editor for PowerPoint</title>
    <link rel="stylesheet" href="/office/powerpoint/styles.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">ikmal editor</p>
        <h1>Review slide text</h1>
        <p id="state">Waiting for PowerPoint…</p>
      </header>
      <section class="controls">
        <label for="style">Inline style</label>
        <select id="style">
          <option value="wave">Wavy underline</option>
          <option value="dotted">Dotted underline</option>
          <option value="highlight">Text highlight color</option>
        </select>
        <button id="check" type="button" disabled>Check presentation text</button>
        <button id="clear" type="button" disabled>Clear ikmal marks</button>
      </section>
      <section>
        <h2>Suggestions</h2>
        <ol id="findings" class="findings"><li class="empty">Open a presentation, then check its text.</li></ol>
      </section>
    </main>
    <script type="module" src="/office/powerpoint/app.js"></script>
  </body>
</html>

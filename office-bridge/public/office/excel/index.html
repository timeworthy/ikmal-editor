<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ikmal editor for Excel</title>
    <link rel="stylesheet" href="/office/excel/styles.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">ikmal editor</p>
        <h1>Review selected cells</h1>
        <p id="state">Waiting for Excel…</p>
      </header>
      <section class="controls">
        <label for="style">Cell finding style</label>
        <select id="style">
          <option value="wave">Wavy-style mark</option>
          <option value="dotted">Dotted-style mark</option>
          <option value="highlight">Cell highlight</option>
        </select>
        <button id="check" type="button" disabled>Check selected cells</button>
        <button id="clear" type="button" disabled>Clear ikmal marks</button>
      </section>
      <section>
        <h2>Suggestions</h2>
        <ol id="findings" class="findings"><li class="empty">Select cells in Excel, then check them.</li></ol>
      </section>
    </main>
    <script src="/office/excel/app.js"></script>
  </body>
</html>
